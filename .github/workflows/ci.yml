name: Repo Learning CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Architecture Asset
        run: test -f docs/repo_learning_flow.png

      - name: Validate Repository
        run: bash scripts/validate.sh
